# Resumen diario por ntfy.sh. Solo lee data/ del repo: no escanea, no escribe
# y no usa credenciales de trading. Sin el secret NTFY_TOPIC no hace nada.
name: resumen-diario

on:
  schedule:
    - cron: "7 12 * * *"     # 09:07 en Argentina (UTC-3, sin horario de verano)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar resumen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.notify daily
